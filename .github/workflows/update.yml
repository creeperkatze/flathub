name: Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  FLATPAK_ID: dev.creeperkatze.full-steam-ahead

jobs:
  auto-update:
    name: Check for a new release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        name: Check for an update
        with:
          args: --edit-only ${{ env.FLATPAK_ID }}.yml

      - name: Check updated
        id: is-updated
        run: |
          git status -s -uno
          [ -z "$(git status -s -uno)" ] || echo "updated=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.is-updated.outputs.updated
        with:
          python-version: "3.13"

      - name: Regenerate vendored sources
        if: steps.is-updated.outputs.updated
        run: ./update-sources.sh

      - name: Reset
        run: git checkout -- ${{ env.FLATPAK_ID }}.yml *.xml

      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        name: Recheck and open PR
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          GIT_AUTHOR_EMAIL: ${{ env.GIT_USER_EMAIL }}
          GIT_COMMITTER_EMAIL: ${{ env.GIT_USER_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork ${{ env.FLATPAK_ID }}.yml
